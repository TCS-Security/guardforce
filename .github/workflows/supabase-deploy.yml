name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  # Manual re-run, for when a deploy failed and main has since moved on.
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

# Single cloud project for now (`guardforce-staging`): both Vercel previews and
# the production deployment point at it, so migrations only ever apply on main.
# Two-project split later: add a `pull_request` job that pushes to staging and
# point this job at SUPABASE_PROJECT_REF_PRODUCTION / SUPABASE_DB_PASSWORD_PRODUCTION.
jobs:
  deploy:
    name: deploy to cloud project
    runs-on: ubuntu-latest
    # Both commands need the access token: `db push --linked` re-reads the linked
    # project through the API before it touches the database. Setting it per-step is
    # how the push ended up failing with "Access token not provided" while the link
    # right above it succeeded.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Must track the CLI that writes `supabase/config.toml` locally (see the
          # `supabase` version pinned in the README / used by whoever ran `supabase init`).
          # setup-cli's default is years behind, and `supabase link` parses the whole
          # config before it does anything: an older binary rejects keys a newer one
          # emits ("failed to parse config: N error(s) decoding") and every migration
          # silently stays unapplied. Bump this in the same commit as any CLI upgrade.
          version: 2.117.0

      # Missing credentials otherwise surface as a CLI error that names neither the
      # secret nor the repository it belongs in, several steps later.
      - name: check credentials are configured
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "${{ vars.SUPABASE_PROJECT_REF }}" ] || missing="$missing SUPABASE_PROJECT_REF(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing — add it under Settings → Secrets and variables → Actions."
            echo "### Migrations did NOT run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secret(s): **$missing**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`SUPABASE_DB_PASSWORD\` is the database password for the linked project" >> "$GITHUB_STEP_SUMMARY"
            echo "(Supabase dashboard → Project Settings → Database). Add it under" >> "$GITHUB_STEP_SUMMARY"
            echo "Settings → Secrets and variables → Actions, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --workdir .
      - run: supabase db push --linked --workdir .

      # A failure here leaves the cloud database behind the code that expects it, and
      # nothing else surfaces that. Say so loudly in the run summary.
      - if: failure()
        run: |
          echo "### Migrations did NOT reach the cloud project" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`main\` now contains schema the database does not have. Anything merged since" >> "$GITHUB_STEP_SUMMARY"
          echo "the last green run of this workflow is live in the app but missing its tables," >> "$GITHUB_STEP_SUMMARY"
          echo "policies or permission rows. Fix and re-run via *Run workflow*." >> "$GITHUB_STEP_SUMMARY"
